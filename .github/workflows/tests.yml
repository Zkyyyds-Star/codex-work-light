name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install BLE dependency
        run: python -m pip install -r requirements.txt
      - name: Test without hardware or personal configuration
        run: python -X utf8 -B -m unittest discover -s tests -p "test_*.py" -v
